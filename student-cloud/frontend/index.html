<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#232f3e" />
  <title>Student Management Portal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">&#127891;</span>
      <div>
        <h1>Student Management Portal</h1>
        <p>Students, attendance and fees</p>
      </div>
    </div>
    <div class="topbar-actions">
      <div id="accountBar" class="account-bar" hidden>
        <span id="accountName"></span>
        <button id="logoutBtn" class="btn small">Sign out</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="authView" class="auth-layout">
      <section class="card narrow">
        <h2>Sign in to manage records</h2>
        <p class="muted">Manage students, attendance and fee records.</p>
        <form id="loginForm" class="stack">
          <label>Email<input name="email" type="email" autocomplete="username" required maxlength="120" /></label>
          <label>Password
            <span class="password-control">
              <input name="password" type="password" autocomplete="current-password" required />
              <button class="password-toggle" type="button" data-toggle-password aria-label="Show password" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle><path class="eye-slash" d="M3 3l18 18"></path></svg>
              </button>
            </span>
          </label>
          <button class="btn primary" type="submit">Sign in</button>
          <p id="loginError" class="error" role="alert"></p>
        </form>
      </section>
    </section>

    <section id="portalView" hidden>
      <nav id="portalNav" class="portal-nav" aria-label="Portal sections"></nav>
      <div id="portalContent" class="portal-content" aria-live="polite"></div>
    </section>
  </main>

  <footer class="footer">Student Management Portal &middot; Students, attendance and fees</footer>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
