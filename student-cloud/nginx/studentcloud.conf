server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /var/www/studentcloud;
    index index.html;
    client_max_body_size 100k;

    # Frontend (static files)
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; upgrade-insecure-requests" always;
        try_files $uri $uri/ /index.html;
    }

    # Backend API -> Node.js (PM2) on port 5000
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # Health check used by the Load Balancer target group
    location = /health {
        auth_basic off;
        proxy_pass http://127.0.0.1:5000/health;
        access_log off;
    }

    location = /health/db {
        proxy_pass http://127.0.0.1:5000/health/db;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
